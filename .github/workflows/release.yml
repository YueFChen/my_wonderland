name: Plugin release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout the pinned Core SDK source
        shell: pwsh
        env:
          CORE_REF: f5c6687025e64e5a5f843b7a76c8494f23132afb
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/YueFChen/Wonderland_Assistant.git core
          git -C core fetch --depth=1 origin $env:CORE_REF
          git -C core checkout --detach $env:CORE_REF

      - uses: actions/checkout@v7
        with:
          path: core/plugins/my_wonderland
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.27.0

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install locked plugin dependencies
        run: pnpm install --frozen-lockfile
        working-directory: core/plugins/my_wonderland

      - name: Typecheck plugin UI
        run: pnpm typecheck
        working-directory: core/plugins/my_wonderland

      - name: Build release package
        run: pnpm build:release
        working-directory: core/plugins/my_wonderland

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content -Raw 'core/plugins/my_wonderland/package/manifest.json' | ConvertFrom-Json
          $packagePath = "core/plugins/my_wonderland/target/release/$($manifest.id)-$($manifest.version)-windows-$($manifest.platform.architecture).wplug"
          gh release create $env:GITHUB_REF_NAME $packagePath --repo $env:GITHUB_REPOSITORY --title "$($manifest.name) v$($manifest.version)" --generate-notes --verify-tag
